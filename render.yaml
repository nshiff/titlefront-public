services:
  - type: web
    runtime: static
    name: titlefront-site
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # Add custom domains after the first deploy succeeds (see notes):
    # domains:
    #   - titlefront.com
    #   - titlefront.co.uk